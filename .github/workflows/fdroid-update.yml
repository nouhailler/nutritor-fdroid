name: F-Droid Repo Update

on:
  release:
    types: [published]

jobs:
  update-fdroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout F-Droid repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fdroidserver
        run: sudo apt-get install -y fdroidserver

      - name: Download APK from release
        run: |
          # Récupère l'URL du premier APK attaché à la release
          APK_URL=$(echo '${{ toJson(github.event.release.assets) }}' \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          apk = next((a for a in assets if a['name'].endswith('.apk')), None)
          print(apk['browser_download_url'] if apk else '')
          ")

          if [ -z "$APK_URL" ]; then
            echo "❌ Aucun APK trouvé dans la release"
            exit 1
          fi

          echo "📦 Téléchargement : $APK_URL"
          curl -L "$APK_URL" -o "repo/nutritor-${{ github.event.release.tag_name }}.apk"

      - name: Remove old APKs (keep last 3 versions)
        run: |
          cd repo
          ls -t *.apk 2>/dev/null | tail -n +4 | xargs -r rm -v

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > keystore.p12

      - name: Run fdroid update
        run: fdroid update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/ metadata/
          git commit -m "release: Nutritor ${{ github.event.release.tag_name }}" || echo "Rien à commiter"
          git push
